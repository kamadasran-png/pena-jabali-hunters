name: Deploy web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare web artifact
        run: |
          mkdir -p web/assets/logos
          cp assets/logos/logo-pjhunters.png web/assets/logos/logo-pjhunters.png
          mkdir -p web/data
          cp -R data/. web/data/

      - name: Validate published data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              Path("web/data/cotos/cotos.json"),
              Path("web/data/especies/especies.json"),
              Path("web/data/modalidades/modalidades.json"),
              Path("web/data/tarjetas/tarjetas.json"),
          ]

          for path in required:
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Falta el archivo de datos publicado: {path}")
              with path.open(encoding="utf-8") as fh:
                  json.load(fh)
              print(f"OK: {path}")
          PY

      - name: Upload web artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
